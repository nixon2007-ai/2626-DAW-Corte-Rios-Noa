{% extends "base.html" %}

{% block titulo %}Módulo Proveedores{% endblock %}

{% block content %}
<section class="container py-5">
    <h2 class="text-center mb-5"><strong>Módulo de Proveedores</strong></h2>

    <div class="table-responsive">
        <table class="table table-striped table-hover shadow">
            <thead class="table-dark">
                <tr>
                    <th>Nombre / Empresa</th>
                    <th>Producto que suministra</th>
                    <th>Contacto</th>
                </tr>
            </thead>
            <tbody>
                {% for p in proveedores %}
                <tr>
                    <td>{{ p.nombre }}</td>
                    <td>{{ p.producto }}</td>
                    <td>{{ p.contacto }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</section>
{% endblock %}
